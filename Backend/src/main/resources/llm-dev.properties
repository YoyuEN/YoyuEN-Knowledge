# 简单对话配置
chat.simple.base-url=https://dashscope.aliyuncs.com/compatible-mode
chat.simple.api-key=${DASHSCOPE_API_KEY}
chat.simple.model=qwen3-max

# 长对话配置
chat.long.base-url=https://dashscope.aliyuncs.com/api
chat.long.api-key=${DASHSCOPE_API_KEY}
