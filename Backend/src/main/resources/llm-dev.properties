# 简单对话配置
chat.simple.base-url=https://dashscope.aliyuncs.com/compatible-mode
chat.simple.api-key=${DASHSCOPE_API_KEY}
chat.simple.model=qwen3-max

# 长对话配置
chat.long.base-url=https://dashscope.aliyuncs.com/api
chat.long.api-key=${DASHSCOPE_API_KEY}
chat.long.model=qwen-max

# 多模态对话
chat.multimodal.base-url=https://dashscope.aliyuncs.com/api
chat.multimodal.api-key=${DASHSCOPE_API_KEY}
chat.multimodal.model=qwen-multimodal-v1

# RAG对话
embedding.base-url=https://dashscope.aliyuncs.com/compatible-mode
embedding.api-key=${DASHSCOPE_API_KEY}
embedding.model=text-embedding-v4

# 文生图配置
image.generation.base-url=https://dashscope.aliyuncs.com/api/v1/services/aigc/text2image/image-synthesis
image.generation.api-key=${DASHSCOPE_API_KEY}
image.generation.model=wanx-v1
image.generation.size=1280*720
image.generation.style=<chinese painting>

# 图生图配置（动漫化）
image.to-image.base-url=https://dashscope.aliyuncs.com/api/v1/services/aigc/image-generation/generation
image.to-image.api-key=${DASHSCOPE_API_KEY}
image.to-image.model=wanx-sketch-to-image-v1
image.to-image.style=<anime>
