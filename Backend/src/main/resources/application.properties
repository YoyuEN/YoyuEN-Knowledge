spring.application.name=Backend

# 端口配置
server.port=12138
server.servlet.context-path=/api

spring.config.import=classpath:llm-dev.properties

# spring-ai
spring.ai.openai.api-key=${DASHSCOPE_API_KEY}
spring.ai.openai.chat.options.model=qwen-max
spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode

# MySQL
#spring.datasource.url=jdbc:mysql://localhost:3306/init?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=242431
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/know-ai
spring.datasource.username=postgres
spring.datasource.password=242431
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# hikari连接池配置
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
# 上传文件大小限制
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Mybatis plus
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.type-aliases-package=com.yoyuen.backend.entity
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Logging
logging.level.com.yoyuen.backend.service.ai.impl.VolcengineImageServiceImpl=DEBUG

# Knife4j / SpringDoc OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# PageHelper分页插件
#pagehelper.helperDialect=mysql
#pagehelper.supportMethodsArguments=true
#pagehelper.params=count=countSql

# MinIO
minio.endpoint=http://118.89.135.164:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=default

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/chat_db
spring.data.mongodb.database=backend
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.auto-create-index=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=242431
spring.data.redis.database=0
spring.data.redis.timeout=3000ms
# Lettuce 连接池（需要 commons-pool2）
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=1000ms

# PgVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1024

# Security JWT
security.secret=123123123
security.salt=123123123
security.allow-list[0]=/v3/**
security.allow-list[1]=/swagger-ui/**
security.allow-list[2]=/doc.html
security.allow-list[3]=/webjars/**
security.allow-list[4]=/auth/**
security.allow-list[5]=/ai/chat/**
security.allow-list[6]=/login/oauth2/**
security.allow-list[7]=/conversation/**
security.allow-list[8]=/knowledge/**
security.allow-list[9]=/resource/**
security.allow-list[10]=/comment/**
security.allow-list[11]=/content/**
security.allow-list[12]=/murmur/**
security.allow-list[13]=/photo/**
security.allow-list[14]=/dashboard/**
security.admin-init=true
security.password=123123

# Volcengine (字节跳动火山引擎)
volcengine.access-key=${VOLCENGINE_ACCESS_KEY}
volcengine.secret-key=${VOLCENGINE_SECRET_KEY}
volcengine.region=cn-north-1
volcengine.cv.endpoint=https://visual.volcengineapi.com
# Ark API (豆包大模型)
volcengine.ark.endpoint=https://ark.cn-beijing.volces.com/api/v3
volcengine.ark.api-key=3136f3f8-4759-4f4e-b4a5-cb6827c38a64
volcengine.ark.model=doubao-seedream-4-5-251128
