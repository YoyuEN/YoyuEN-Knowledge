spring.application.name=Backend

# 端口配置
server.port=12138
server.servlet.context-path=/api

spring.config.import=classpath:llm-dev.properties

# spring-ai
spring.ai.openai.api-key=${DASHSCOPE_API_KEY}
spring.ai.openai.chat.options.model=qwen-max
spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode

# MySQL
#spring.datasource.url=jdbc:mysql://localhost:3306/init?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=242431
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/know-ai
spring.datasource.username=postgres
spring.datasource.password=242431
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
# hikari连接池配置
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
# 上传文件大小限制
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Mybatis plus
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.type-aliases-package=com.yoyuen.backend.entity
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Knife4j / SpringDoc OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# PageHelper分页插件
#pagehelper.helperDialect=mysql
#pagehelper.supportMethodsArguments=true
#pagehelper.params=count=countSql

# MinIO
minio.endpoint=http://8.140.55.44:9005
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=yoyuen

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/chat_db
spring.data.mongodb.database=backend
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.auto-create-index=true



